// ===================================================================
        // UPLOAD STUDENTS SCREEN - Màn hình Giảng viên: Upload danh sách sinh viên
        // ===================================================================
        // Chỉ hiển thị cho role 'lecturer'. Gồm:
        //   - Form upload file .csv / .xlsx (input type="file", accept=".csv, .xlsx")
        //   - Nút "Tải lên danh sách" (màu primary xanh, hover)
        //   - Gửi FormData chứa file lên API POST /api/teachers/upload-students
        //   - Vô hiệu hóa nút + hiện "Đang xử lý..." khi đang upload
        //   - Toast thông báo thành công / thất bại
        //   - Tự động cập nhật lại bảng danh sách sinh viên (GET /api/students)
        const UploadStudentsScreen = () => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [uploading, setUploading] = useState(false);
            const [students, setStudents] = useState([]);
            const [total, setTotal] = useState(0);
            const [loadingTable, setLoadingTable] = useState(true);
            const [tableError, setTableError] = useState('');
            const [toast, setToast] = useState(null); // { type: 'success' | 'error', message }

            // Toast tự động ẩn sau 5 giây.
            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => setToast(null), 5000);
                return () => clearTimeout(timer);
            }, [toast]);

            // Tải danh sách sinh viên từ GET /api/students.
            const loadStudents = async () => {
                setLoadingTable(true);
                setTableError('');
                try {
                    const res = await fetch(`${API_BASE}/api/students`, {
                        headers: getAuthHeaders()
                    });
                    if (res.status === 401 || res.status === 403) {
                        throw new Error('Phiên đăng nhập đã hết hạn hoặc không có quyền truy cập.');
                    }
                    if (!res.ok) throw new Error(`Lỗi máy chủ: HTTP ${res.status}`);
                    const data = await res.json();
                    setStudents(Array.isArray(data.students) ? data.students : []);
                    setTotal(data.total || 0);
                } catch (err) {
                    console.error('[UploadStudents] Lỗi tải danh sách:', err);
                    setTableError(err.message || 'Không thể tải danh sách sinh viên.');
                } finally {
                    setLoadingTable(false);
                }
            };

            // Gọi tải danh sách khi component mount.
            useEffect(() => {
                loadStudents();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // Xử lý sự kiện chọn file.
            const handleFileChange = (e) => {
                const file = e.target.files && e.target.files[0];
                setSelectedFile(file || null);
            };

            // Xử lý sự kiện upload: gửi FormData chứa file lên API backend.
            const handleUpload = async (e) => {
                e.preventDefault();
                if (!selectedFile) {
                    setToast({ type: 'error', message: 'Vui lòng chọn file .csv hoặc .xlsx trước khi tải lên.' });
                    return;
                }

                setUploading(true);
                setToast(null);
                try {
                    const formData = new FormData();
                    formData.append('file', selectedFile);

                    const res = await fetch(`${API_BASE}/api/teachers/upload-students`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: formData
                    });

                    if (res.status === 401 || res.status === 403) {
                        throw new Error('Phiên đăng nhập đã hết hạn hoặc không có quyền tải lên.');
                    }

                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(data.detail || `Lỗi máy chủ: HTTP ${res.status}`);
                    }

                    // Hiển thị Toast thành công với báo cáo từ backend.
                    setToast({
                        type: 'success',
                        message: data.message || `Đã thêm thành công ${data.created || 0} sinh viên, bỏ qua ${data.skipped || 0} sinh viên trùng lặp.`
                    });

                    // Xóa file đã chọn sau khi upload xong.
                    setSelectedFile(null);
                    if (e.target) e.target.value = '';

                    // Tự động cập nhật lại bảng danh sách sinh viên bên dưới.
                    await loadStudents();
                } catch (err) {
                    console.error('[UploadStudents] Lỗi upload:', err);
                    setToast({ type: 'error', message: err.message || 'Tải lên thất bại. Vui lòng thử lại.' });
                } finally {
                    setUploading(false);
                }
            };

            return (
                <div className="space-y-8 animate-fadeInUp">
                    {/* Header */}
                    <div className="flex justify-between items-center no-print">
                        <div>
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-indigo-600 text-white flex items-center justify-center shadow-primary-glow">
                                    <Icon name="user-plus" />
                                </div>
                                <h2 className="text-2xl lg:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Danh Sách Sinh Viên</h2>
                            </div>
                            <p className="text-sm text-slate-500 dark:text-slate-400 ml-14">Tải lên danh sách sinh viên (.csv / .xlsx) để tạo tài khoản hàng loạt.</p>
                        </div>
                        <button
                            onClick={loadStudents}
                            disabled={loadingTable}
                            className="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-xl font-semibold transition-all duration-300 flex items-center gap-2 border border-slate-200 dark:border-slate-700 hover:scale-[1.03] active:scale-95 text-sm disabled:opacity-60">
                            <Icon name="rotate" className={loadingTable ? 'fa-spin' : ''} /> Làm mới
                        </button>
                    </div>

                    {/* Toast thông báo */}
                    {toast && (
                        <div className={`fixed top-6 right-6 z-[60] max-w-sm w-full shadow-2xl rounded-2xl overflow-hidden border animate-fadeInUp ${toast.type === 'success' ? 'bg-emerald-500 border-emerald-400' : 'bg-rose-500 border-rose-400'}`} role="alert">
                            <div className="flex items-start gap-3 p-4">
                                <div className="text-white text-xl mt-0.5 shrink-0">
                                    <Icon name={toast.type === 'success' ? 'circle-check' : 'circle-exclamation'} />
                                </div>
                                <div className="flex-1">
                                    <div className="text-white font-bold text-sm mb-0.5">
                                        {toast.type === 'success' ? 'Thành công!' : 'Thất bại!'}
                                    </div>
                                    <div className="text-white/95 text-xs leading-relaxed">{toast.message}</div>
                                </div>
                                <button onClick={() => setToast(null)} className="text-white/80 hover:text-white text-lg leading-none shrink-0">
                                    <Icon name="xmark" />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Card Upload Form */}
                    <Card className="p-6 lg:p-8 no-print">
                        <form onSubmit={handleUpload} className="space-y-5">
                            <div>
                                <label className="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">
                                    Chọn file danh sách sinh viên (.csv / .xlsx):
                                </label>
                                <div className="flex flex-col md:flex-row gap-4">
                                    <div className="flex-1">
                                        <input
                                            type="file"
                                            accept=".csv, .xlsx"
                                            onChange={handleFileChange}
                                            disabled={uploading}
                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-dashed border-2 border-slate-300 dark:border-slate-700 rounded-xl p-4 text-sm text-slate-700 dark:text-slate-300 outline-none focus:ring-2 focus:ring-primary-500/40 focus:border-primary-500 transition-all duration-300 shadow-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-primary-600 file:text-white hover:file:bg-primary-500 file:cursor-pointer disabled:opacity-60"
                                        />
                                        <p className="text-xs text-slate-400 mt-2 flex items-center gap-1.5">
                                            <Icon name="circle-info" /> Cần có 3 cột: <strong className="font-mono">MSSV</strong>, <strong className="font-mono">HoTen</strong>, <strong className="font-mono">Lop</strong>. Mật khẩu mặc định: <strong className="font-mono">123456</strong>.
                                        </p>
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={uploading || !selectedFile}
                                        className="md:w-56 bg-gradient-to-r from-primary-600 to-indigo-600 hover:from-primary-500 hover:to-indigo-500 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold rounded-xl p-4 transition-all duration-300 flex items-center justify-center gap-2 shadow-soft hover:shadow-primary-glow hover:scale-[1.02] active:scale-95 tracking-wide"
                                    >
                                        {uploading ? (
                                            <>
                                                <Icon name="spinner" className="fa-spin" /> Đang xử lý...
                                            </>
                                        ) : (
                                            <>
                                                <Icon name="cloud-arrow-up" /> TẢI LÊN DANH SÁCH
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </Card>

                    {/* Bảng danh sách sinh viên */}
                    <div>
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                <Icon name="users" className="text-primary-500" /> Danh sách sinh viên hiện có
                                <span className="ml-2 px-3 py-1 rounded-full bg-primary-100 dark:bg-primary-950/60 text-primary-700 dark:text-primary-300 text-sm font-bold border border-primary-300 dark:border-primary-800">
                                    {total} sinh viên
                                </span>
                            </h3>
                        </div>

                        {loadingTable && (
                            <Card className="p-10 text-center text-slate-500 dark:text-slate-400">
                                <Icon name="spinner" className="fa-spin text-3xl text-primary-500 mb-3" />
                                <div>Đang tải danh sách sinh viên...</div>
                            </Card>
                        )}

                        {tableError && !loadingTable && (
                            <div className="bg-rose-50 border border-rose-300 border-l-4 border-l-rose-500 text-rose-700 px-5 py-4 rounded-xl shadow-sm flex items-start gap-3" role="alert">
                                <Icon name="circle-exclamation" className="mt-0.5 text-rose-500" />
                                <div>
                                    <strong className="font-bold block mb-0.5">Không tải được danh sách!</strong>
                                    <span className="block sm:inline">{tableError}</span>
                                </div>
                            </div>
                        )}

                        {!loadingTable && !tableError && students.length === 0 && (
                            <Card className="p-12 text-center">
                                <div className="w-20 h-20 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-4xl text-slate-400 mb-4">
                                    <Icon name="user-group" />
                                </div>
                                <h3 className="text-lg font-bold text-slate-700 dark:text-slate-200 mb-1">Chưa có sinh viên nào</h3>
                                <p className="text-sm text-slate-500 dark:text-slate-400">Hãy tải lên file danh sách sinh viên (.csv / .xlsx) để bắt đầu.</p>
                            </Card>
                        )}

                        {!loadingTable && !tableError && students.length > 0 && (
                            <Card className="overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead>
                                            <tr className="bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200">
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold">STT</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold">MSSV</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold">Họ và tên</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold">Lớp</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold">Vai trò</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {students.map((s, idx) => (
                                                <tr key={s.username || s.mssv || idx} className="border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                    <td className="p-3.5 text-slate-500 font-mono">{idx + 1}</td>
                                                    <td className="p-3.5 font-mono font-bold text-primary-700 dark:text-primary-400">{s.mssv || s.username}</td>
                                                    <td className="p-3.5 font-medium text-slate-800 dark:text-slate-200">{s.name || s.full_name}</td>
                                                    <td className="p-3.5 text-slate-600 dark:text-slate-300">{s.lop || s.department || '—'}</td>
                                                    <td className="p-3.5">
                                                        <span className="px-2.5 py-1 rounded-full bg-emerald-100 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 text-xs font-bold border border-emerald-300 dark:border-emerald-800">
                                                            Sinh viên
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        )}
                    </div>
                </div>
            );
        };

        // ===================================================================
        // LOGIN SCREEN - Màn hình đăng nhập (JWT + RBAC)
        // ===================================================================
const LoginScreen = ({ onLogin, theme, toggleTheme }) => {
            // Tab đăng nhập: 'student' | 'lecturer'
            const [mode, setMode] = useState('student');

            // Sinh viên: MSSV + Mật khẩu
            const [studentId, setStudentId] = useState('');
            const [studentPassword, setStudentPassword] = useState('');

            // Giảng viên: Tên đăng nhập + Mật khẩu
            const [lecturerUser, setLecturerUser] = useState('');
            const [lecturerPassword, setLecturerPassword] = useState('');

            const [showPassword, setShowPassword] = useState(false);
            const [remember, setRemember] = useState(true);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                const username = mode === 'student' ? studentId.trim() : lecturerUser.trim();
                const password = mode === 'student' ? studentPassword : lecturerPassword;

                if (!username || !password) {
                    setError(mode === 'student'
                        ? 'Vui lòng nhập đầy đủ MSSV và mật khẩu.'
                        : 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.');
                    return;
                }
                setLoading(true);
                setError('');
                try {
                    const res = await fetch(`${API_BASE}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(data.detail || 'Đăng nhập thất bại. Vui lòng kiểm tra lại.');
                    }
                    onLogin(data);
                } catch (err) {
                    console.error('[Login] Lỗi:', err);
                    setError(err.message || 'Không kết nối được máy chủ. Vui lòng chạy backend (uvicorn main:app --reload).');
                } finally {
                    setLoading(false);
                }
            };

            const switchMode = (m) => {
                setMode(m);
                setError('');
                setShowPassword(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center relative overflow-hidden bg-slate-50 dark:bg-navy-950">
                    {/* Gradient background decoration */}
                    <div className="absolute inset-0 pointer-events-none" aria-hidden="true">
                        <div className="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-gradient-to-br from-primary-500/20 to-indigo-600/20 blur-3xl"></div>
                        <div className="absolute -bottom-40 -right-40 w-[500px] h-[500px] rounded-full bg-gradient-to-br from-emerald-500/10 to-cyan-500/10 blur-3xl"></div>
                        <div className="absolute top-1/3 left-1/2 -translate-x-1/2 w-[700px] h-[300px] rounded-full bg-gradient-to-r from-primary-500/10 via-indigo-500/10 to-transparent blur-3xl"></div>
                    </div>

                    <div className="relative z-10 w-full max-w-md px-6 animate-fadeInUp">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-indigo-600 text-white text-3xl font-bold font-mono shadow-primary-glow mb-4">
                                IS
                            </div>
                            <h1 className="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                                ISO 286 <span className="text-primary-600 dark:text-primary-400">EdTech</span>
                            </h1>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
                                Hệ thống Ra đề &amp; Tra cứu Dung sai<br className="sm:hidden" />
                                <span className="hidden sm:inline">Lắp ghép Tiêu chuẩn Quốc tế</span>
                            </p>
                        </div>

                        <div className="bg-white/90 dark:bg-slate-800/90 backdrop-blur-xl rounded-2xl shadow-soft border border-slate-100 dark:border-slate-700 p-8">
                            <div className="flex items-center justify-between mb-6">
                                <div>
                                    <h2 className="text-xl font-bold text-slate-900 dark:text-white">Đăng nhập</h2>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Sử dụng tài khoản của bạn để tiếp tục</p>
                                </div>
                                <button
                                    type="button"
                                    onClick={toggleTheme}
                                    className="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 hover:scale-110 active:scale-95 transition-all duration-300 shadow-sm shrink-0"
                                    title={theme === 'light' ? 'Chuyển sang chế độ tối' : 'Chuyển sang chế độ sáng'}
                                >
                                    <Icon name={theme === 'light' ? 'moon' : 'sun'} />
                                </button>
                            </div>

                            {/* Tabs: Sinh viên / Giảng viên */}
                            <div className="grid grid-cols-2 gap-2 mb-6 bg-slate-100 dark:bg-slate-900/60 p-1.5 rounded-xl no-print">
                                <button
                                    type="button"
                                    onClick={() => switchMode('student')}
                                    className={`flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 ${mode === 'student' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-primary-glow' : 'text-slate-600 dark:text-slate-300 hover:bg-white/60 dark:hover:bg-slate-800'}`}
                                >
                                    <Icon name="user-graduate" /> Sinh Viên
                                </button>
                                <button
                                    type="button"
                                    onClick={() => switchMode('lecturer')}
                                    className={`flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold transition-all duration-300 ${mode === 'lecturer' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-600 dark:text-slate-300 hover:bg-white/60 dark:hover:bg-slate-800'}`}
                                >
                                    <Icon name="chalkboard-user" /> Giảng Viên
                                </button>
                            </div>

                            {error && (
                                <div className="mb-5 bg-rose-50 dark:bg-rose-950/40 border border-rose-300 dark:border-rose-800 border-l-4 border-l-rose-500 text-rose-700 dark:text-rose-300 px-4 py-3 rounded-xl text-sm flex items-start gap-2.5" role="alert">
                                    <Icon name="circle-exclamation" className="mt-0.5 shrink-0" />
                                    <span>{error}</span>
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-4">
                                {mode === 'student' ? (
                                    <div>
                                        <label className="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">
                                            MSSV (Mã số sinh viên)
                                        </label>
                                        <div className="relative">
                                            <Icon name="id-card" className="absolute left-3.5 top-3.5 text-slate-400 text-sm" />
                                            <input
                                                type="text"
                                                value={studentId}
                                                onChange={e => setStudentId(e.target.value)}
                                                placeholder="VD: 2110481"
                                                autoComplete="username"
                                                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition-all duration-300 shadow-sm placeholder:text-slate-400"
                                            />
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <label className="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">
                                            Tên đăng nhập
                                        </label>
                                        <div className="relative">
                                            <Icon name="user" className="absolute left-3.5 top-3.5 text-slate-400 text-sm" />
                                            <input
                                                type="text"
                                                value={lecturerUser}
                                                onChange={e => setLecturerUser(e.target.value)}
                                                placeholder="VD: gv01"
                                                autoComplete="username"
                                                className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500/40 focus:border-primary-500 transition-all duration-300 shadow-sm placeholder:text-slate-400"
                                            />
                                        </div>
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">
                                        Mật khẩu
                                    </label>
                                    <div className="relative">
                                        <Icon name="lock" className="absolute left-3.5 top-3.5 text-slate-400 text-sm" />
                                        <input
                                            type={showPassword ? 'text' : 'password'}
                                            value={mode === 'student' ? studentPassword : lecturerPassword}
                                            onChange={e => mode === 'student'
                                                ? setStudentPassword(e.target.value)
                                                : setLecturerPassword(e.target.value)}
                                            placeholder="••••••••"
                                            autoComplete="current-password"
                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl pl-10 pr-12 py-3 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-primary-500/40 focus:border-primary-500 transition-all duration-300 shadow-sm placeholder:text-slate-400"
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setShowPassword(s => !s)}
                                            className="absolute right-3 top-2.5 text-slate-400 hover:text-primary-600 transition-colors"
                                            title={showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'}
                                        >
                                            <Icon name={showPassword ? 'eye-slash' : 'eye'} />
                                        </button>
                                    </div>
                                </div>

                                <div className="flex items-center justify-between text-sm">
                                    <label className="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-400 select-none">
                                        <input
                                            type="checkbox"
                                            checked={remember}
                                            onChange={e => setRemember(e.target.checked)}
                                            className="w-4 h-4 accent-primary-600 rounded"
                                        />
                                        Ghi nhớ đăng nhập
                                    </label>
                                    <span className="text-primary-600 dark:text-primary-400 font-medium cursor-pointer hover:underline">
                                        Quên mật khẩu?
                                    </span>
                                </div>

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className={`w-full bg-gradient-to-r disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold rounded-xl py-3.5 transition-all duration-300 flex items-center justify-center gap-2 shadow-soft hover:shadow-primary-glow hover:scale-[1.02] active:scale-95 tracking-wide mt-2 ${mode === 'student' ? 'from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500' : 'from-primary-600 to-indigo-600 hover:from-primary-500 hover:to-indigo-500'}`}
                                >
                                    {loading ? <Icon name="spinner" className="fa-spin" /> : <Icon name="right-to-bracket" />}
                                    {loading
                                        ? 'Đang đăng nhập...'
                                        : mode === 'student' ? 'ĐĂNG NHẬP SINH VIÊN' : 'ĐĂNG NHẬP GIẢNG VIÊN'}
                                </button>
                            </form>

                            <div className="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700">
                                <p className="text-[11px] text-slate-400 dark:text-slate-500 text-center leading-relaxed">
                                    Sinh viên không nhìn thấy tab "Tạo Đề Tự Động" và không thể gọi API xuất Word/PDF.<br />
                                    Chỉ Giảng viên được phép tạo đề, xuất file và quản lý sinh viên.
                                </p>
                            </div>
                        </div>

                        <p className="text-center text-[11px] text-slate-400 dark:text-slate-600 mt-6 font-mono">
                            ISO 286 EdTech Engine · JWT Auth + Role-Based Access Control
                        </p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeMenu, setActiveMenu] = useState('lookup');
            const [theme, setTheme] = useState('light');
            const [currentUser, setCurrentUser] = useState(null);
            const [token, setToken] = useState(null);
            const [checkingSession, setCheckingSession] = useState(true);

            // Khôi phục phiên đăng nhập từ localStorage khi tải trang.
            useEffect(() => {
                try {
                    const savedToken = localStorage.getItem('iso286_token');
                    const savedUser = localStorage.getItem('iso286_user');
                    if (savedToken && savedUser) {
                        // Kiểm tra token còn hạn (exp - phần thứ 2 của JWT, đơn vị giây).
                        const parts = savedToken.split('.');
                        if (parts.length === 3) {
                            const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                            const expMs = payload.exp ? payload.exp * 1000 : 0;
                            if (expMs > Date.now()) {
                                AUTH_TOKEN = savedToken;
                                setToken(savedToken);
                                setCurrentUser(JSON.parse(savedUser));
                            } else {
                                localStorage.removeItem('iso286_token');
                                localStorage.removeItem('iso286_user');
                                AUTH_TOKEN = null;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('[Auth] Không khôi phục được phiên đăng nhập.', e);
                    localStorage.removeItem('iso286_token');
                    localStorage.removeItem('iso286_user');
                    AUTH_TOKEN = null;
                } finally {
                    setCheckingSession(false);
                }
            }, []);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

            const handleLogin = (data) => {
                AUTH_TOKEN = data.access_token;
                setToken(data.access_token);
                setCurrentUser(data.user);
                localStorage.setItem('iso286_token', data.access_token);
                localStorage.setItem('iso286_user', JSON.stringify(data.user));
                setActiveMenu('lookup');
            };

            const handleLogout = () => {
                AUTH_TOKEN = null;
                setToken(null);
                setCurrentUser(null);
                localStorage.removeItem('iso286_token');
                localStorage.removeItem('iso286_user');
                setActiveMenu('lookup');
            };

            const isStudent = currentUser && currentUser.role === 'student';

            // Đang khôi phục phiên -> hiển thị splash screen.
            if (checkingSession) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-navy-950">
                        <div className="text-center">
                            <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-primary-500 to-indigo-600 text-white flex items-center justify-center text-3xl font-bold font-mono shadow-primary-glow mb-4 animate-pulseSoft">IS</div>
                            <div className="text-sm text-slate-500 dark:text-slate-400 font-medium">Đang khôi phục phiên đăng nhập...</div>
                        </div>
                    </div>
                );
            }

            // Chưa đăng nhập -> hiển thị màn hình Login.
            if (!currentUser || !token) {
                return <LoginScreen onLogin={handleLogin} theme={theme} toggleTheme={toggleTheme} />;
            }

            const roleLabel = currentUser.role === 'lecturer' ? 'Giảng viên' : 'Sinh viên';

            return (
                <div className="flex h-screen overflow-hidden">
                    <aside className="w-64 bg-gradient-to-b from-slate-900 via-navy-900 to-navy-950 text-slate-300 flex flex-col transition-all duration-300 no-print border-r border-slate-800/60">
                        <div className="p-6 border-b border-slate-800/60 flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-primary-500 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold font-mono text-lg shadow-primary-glow">IS</div>
                            <span className="font-bold text-white tracking-wide leading-tight">ISO 286<br/><span className="text-[11px] text-slate-400 font-normal tracking-widest uppercase">EdTech Engine</span></span>
                        </div>
                        <nav className="flex-1 p-4 space-y-1.5">
                            <button 
                                onClick={() => setActiveMenu('lookup')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'lookup' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="magnifying-glass-chart" className="w-4 text-center" /> Tra Cứu Trực Quan
                            </button>
                            <button 
                                onClick={() => setActiveMenu('learning')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'learning' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="graduation-cap" className="w-4 text-center" /> Hướng Dẫn Học Tập
                            </button>
                            <button 
                                onClick={() => setActiveMenu('library')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'library' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="book-bookmark" className="w-4 text-center" /> Thư Viện ISO 286
                            </button>
{!isStudent && (
                            <button 
                                onClick={() => setActiveMenu('generate')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'generate' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="file-circle-check" className="w-4 text-center" /> Tạo Đề Tự Động
                            </button>
                            )}
                            {isStudent && (
                            <button 
                                onClick={() => setActiveMenu('assignment')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'assignment' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="pen-to-square" className="w-4 text-center" /> Bài Tập Của Tôi
                            </button>
)}
                            {!isStudent && (
                            <button 
                                onClick={() => setActiveMenu('students')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'students' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="user-plus" className="w-4 text-center" /> Quản Lý Sinh Viên
                            </button>
                            )}
<button
                                onClick={() => setActiveMenu('history')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-300 group ${activeMenu === 'history' ? 'bg-gradient-to-r from-primary-600 to-indigo-600 text-white shadow-primary-glow' : 'text-slate-400 hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                <Icon name="clock-rotate-left" className="w-4 text-center" /> Lịch Sử Đề Thi
                            </button>
                        </nav>
                        <div className="p-5 border-t border-slate-800/60 text-[11px] text-slate-500 leading-relaxed">
                            <div className="font-mono">v2.2 Standard Rubric</div>
                            <div>Learning Mode · ISO 286</div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-screen overflow-y-auto print:overflow-visible relative">
                        <header className="h-16 bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/70 dark:border-slate-800/70 backdrop-blur-md flex items-center justify-between px-6 lg:px-10 sticky top-0 z-10 no-print">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-indigo-600 text-white flex items-center justify-center text-sm lg:hidden">
                                    <Icon name="bars" />
                                </div>
<h1 className="text-lg lg:text-xl font-bold tracking-tight text-slate-800 dark:text-white">
{activeMenu === 'lookup' ? 'Module Giảng Dạy & Trực Quan' : activeMenu === 'learning' ? 'Màn Hình Hướng Dẫn Học Tập (Learning Mode)' : activeMenu === 'library' ? 'Kho Dữ Liệu Tiêu Chuẩn Kỹ Thuật ISO' : activeMenu === 'history' ? 'Lịch Sử Đề Thi Đã Tạo' : activeMenu === 'students' ? 'Quản Lý Sinh Viên - Tải Lên Danh Sách' : activeMenu === 'assignment' ? 'Bài Tập Của Tôi - Làm & Nộp Bài' : 'Module Sinh Đề & Chấm Tự Động (Rubric 10.0)'}
                                </h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={toggleTheme} className="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 hover:scale-110 active:scale-95 transition-all duration-300 shadow-sm">
                                    <Icon name={theme === 'light' ? 'moon' : 'sun'} />
                                </button>
                                <div className="flex items-center gap-3 pl-4 border-l border-slate-200 dark:border-slate-700">
                                    <div className="relative">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shadow-md ${currentUser.role === 'lecturer' ? 'bg-gradient-to-br from-primary-500 to-indigo-600 shadow-primary-500/30' : 'bg-gradient-to-br from-emerald-500 to-teal-600 shadow-emerald-500/30'}`}>
                                            {(currentUser.full_name || currentUser.username).charAt(0).toUpperCase()}
                                        </div>
                                        <span className={`absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full border-2 border-white dark:border-slate-900 ${currentUser.role === 'lecturer' ? 'bg-amber-400' : 'bg-emerald-400'}`} title={currentUser.role === 'lecturer' ? 'Toàn quyền (Lecturer)' : 'Quyền học tập (Student)'}></span>
                                    </div>
                                    <div className="text-sm">
                                        <div className="font-semibold text-slate-800 dark:text-white">{currentUser.full_name}</div>
                                        <div className="text-slate-500 dark:text-slate-400 text-xs flex items-center gap-1.5">
                                            <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide ${currentUser.role === 'lecturer' ? 'bg-primary-100 text-primary-700 dark:bg-primary-950/60 dark:text-primary-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300'}`}>
                                                {roleLabel}
                                            </span>
                                            <span className="hidden md:inline">@{currentUser.username}</span>
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleLogout}
                                        title="Đăng xuất"
                                        className="w-9 h-9 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 border border-slate-200 dark:border-slate-700 hover:scale-110 active:scale-95 transition-all duration-300 shadow-sm ml-1"
                                    >
                                        <Icon name="right-from-bracket" />
                                    </button>
                                </div>
                            </div>
                        </header>

<div className="p-6 lg:p-10 pb-24 print:p-0">
{activeMenu === 'lookup' ? <LookupScreen /> : activeMenu === 'learning' ? <LearningScreen /> : activeMenu === 'library' ? <LibraryScreen /> : activeMenu === 'history' ? (currentUser && currentUser.role === 'student' ? <StudentHistoryScreen currentUser={currentUser} /> : <HistoryScreen currentUser={currentUser} />) : activeMenu === 'students' ? <UploadStudentsScreen /> : activeMenu === 'assignment' ? <StudentPortal currentUser={currentUser} /> : <GeneratorScreen />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
