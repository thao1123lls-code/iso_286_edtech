        // ===================================================================
        // STUDENT PORTAL - Module Sinh viên làm bài, nộp bài & Chấm điểm tự động
        // ===================================================================
        const StudentPortal = ({ currentUser }) => {
            // MSSV của sinh viên đang đăng nhập (username trùng MSSV).
            const mssv = (currentUser && currentUser.username) || '';

            // State Form nhập liệu: ES, EI, es, ei (đơn vị µm).
            const [formData, setFormData] = useState({ ES: '', EI: '', es: '', ei: '' });

// State dữ liệu bài tập & kết quả.
            const [assignment, setAssignment] = useState(null);
            const [result, setResult] = useState(null);       // kết quả chấm điểm (result.details)
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            const [isEmpty, setIsEmpty] = useState(false);      // sinh viên chưa có bài tập
            const [error, setError] = useState('');

            // Hàm gọi API GET /api/assignments/{mssv} để tải đề + trạng thái.
            const loadAssignment = async () => {
                setLoading(true);
                setError('');
                setIsEmpty(false);
                try {
                    const res = await fetch(`${API_BASE}/api/assignments/${mssv}`, {
                        headers: getAuthHeaders()
                    });
                    if (res.status === 401 || res.status === 403) {
                        throw new Error('Phiên đăng nhập đã hết hạn hoặc không có quyền truy cập.');
                    }
                    // Graceful Degradation: Chỉ hiện khung lỗi đỏ khi server thực sự lỗi
                    // (HTTP >= 500) hoặc lỗi mạng. Mọi mã khác (404, 422, ...) đều được
                    // coi là "chưa có bài tập" -> hiển thị Empty State thân thiện.
                    if (!res.ok) {
                        if (res.status >= 500) {
                            throw new Error(`Lỗi máy chủ: HTTP ${res.status}`);
                        }
                        // 4xx (VD 404) hoặc mã khác -> không có bài tập, xem như rỗng.
                        setIsEmpty(true);
                        setAssignment(null);
                        return;
                    }

                    const data = await res.json();
                    setAssignment(data);

                    // Graceful Degradation: Backend trả về {"status": "empty"} khi SV chưa có bài.
                    if (data.status === 'empty') {
                        setIsEmpty(true);
                        setAssignment(null);
                        return;
                    }

                    // Nếu đề đã nộp -> hiện Thẻ Kết Quả ngay, ẩn form.
                    if (data.status === 'submitted') {
                        setResult({
                            score: data.score,
                            details: (data.details || []).length
                                ? data.details
                                : buildDetailsFromState(data),
                            correct_answers: data.correct_answers,
                            student_answers: data.student_answers,
                            already_submitted: true
                        });
                    }
                } catch (err) {
                    // Chỉ hiện lỗi đỏ khi thực sự là lỗi mạng / server sập (network error).
                    console.error('[StudentPortal] Lỗi tải bài tập:', err);
                    setError(err.message || 'Không thể tải bài tập. Vui lòng đảm bảo Backend đang chạy.');
                } finally {
                    setLoading(false);
                }
            };

            // Dựng bảng đối chiếu từ GET response (khi GET không kèm details).
            const buildDetailsFromState = (data) => {
                const correct = data.correct_answers || {};
                const student = data.student_answers || {};
                const labels = {
                    ES: 'Sai lệch trên Lỗ - ES (µm)',
                    EI: 'Sai lệch dưới Lỗ - EI (µm)',
                    es: 'Sai lệch trên Trục - es (µm)',
                    ei: 'Sai lệch dưới Trục - ei (µm)'
                };
                return ['ES', 'EI', 'es', 'ei'].map(key => {
                    const c = Number(correct[key]);
                    const s = Number(student[key]);
                    return {
                        key,
                        label: labels[key],
                        correct: correct[key],
                        student: student[key],
                        is_correct: Math.abs(c - s) < 1e-9
                    };
                });
            };

            // Gọi tải bài tập khi component mount.
            useEffect(() => {
                if (mssv) loadAssignment();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [mssv]);

            // Hàm xử lý khi sinh viên bấm nút "NỘP BÀI".
            const handleSubmit = async (e) => {
                e.preventDefault();

                // Kiểm tra tất cả 4 ô đều đã nhập.
                const emptyKeys = Object.keys(formData).filter(k => formData[k] === '' || formData[k] === null || isNaN(Number(formData[k])));
                if (emptyKeys.length > 0) {
                    setError('Vui lòng nhập đầy đủ và hợp lệ cả 4 thông số (ES, EI, es, ei).');
                    return;
                }

                setSubmitting(true);
                setError('');
                try {
                    const payload = {
                        ES: Number(formData.ES),
                        EI: Number(formData.EI),
                        es: Number(formData.es),
                        ei: Number(formData.ei)
                    };

                    // Gọi API POST /api/assignments/{mssv}/submit (Auto-grading).
                    const res = await fetch(`${API_BASE}/api/assignments/${mssv}/submit`, {
                        method: 'POST',
                        headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify(payload)
                    });

                    if (res.status === 401 || res.status === 403) {
                        throw new Error('Phiên đăng nhập đã hết hạn hoặc không có quyền nộp bài.');
                    }

                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(data.detail || `Lỗi máy chủ: HTTP ${res.status}`);
                    }

                    // Lưu kết quả chấm điểm -> ẩn form, hiện Thẻ Kết Quả.
                    setResult({
                        score: data.score,
                        details: data.details || [],
                        correct_answers: data.correct_answers,
                        student_answers: data.student_answers,
                        already_submitted: !!data.already_submitted
                    });
                    setAssignment(prev => prev ? { ...prev, status: 'submitted', score: data.score } : prev);
                } catch (err) {
                    console.error('[StudentPortal] Lỗi nộp bài:', err);
                    setError(err.message || 'Nộp bài thất bại. Vui lòng thử lại.');
                } finally {
                    setSubmitting(false);
                }
            };

            // Reset form về trống.
            const handleReset = () => {
                setFormData({ ES: '', EI: '', es: '', ei: '' });
                setError('');
            };

            // Kiểm tra trạng thái đã nộp -> ẩn form, hiện kết quả.
            const isSubmitted = result !== null &&
                (result.already_submitted || assignment?.status === 'submitted');

            if (loading) {
                return (
                    <Card className="p-12 text-center text-slate-500 dark:text-slate-400">
                        <Icon name="spinner" className="fa-spin text-3xl text-primary-500 mb-3" />
                        <div>Đang tải bài tập ISO 286 cho MSSV {mssv}...</div>
                    </Card>
                );
            }

if (error && !assignment) {
                return (
                    <div className="space-y-6 animate-fadeInUp">
                        <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-300 dark:border-rose-800 border-l-4 border-l-rose-500 text-rose-700 dark:text-rose-300 px-5 py-4 rounded-xl shadow-sm flex items-start gap-3" role="alert">
                            <Icon name="circle-exclamation" className="mt-0.5 text-rose-500" />
                            <div>
                                <strong className="font-bold block mb-0.5">Không tải được bài tập!</strong>
                                <span className="block sm:inline">{error}</span>
                            </div>
                        </div>
                    </div>
                );
            }

            // ===== EMPTY STATE: Sinh viên chưa được giao bài tập =====
            // Backend trả về {"status": "empty"} (HTTP 200) khi không tìm thấy đề.
            // Hiển thị Empty State thân thiện thay vì hộp thoại lỗi đỏ.
            if (isEmpty && !assignment && !error) {
                return (
                    <div className="space-y-8 animate-fadeInUp">
                        <div className="flex items-center gap-3 mb-2">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center shadow-primary-glow">
                                <Icon name="pen-to-square" />
                            </div>
                            <h2 className="text-2xl lg:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Bài Tập Của Tôi</h2>
                        </div>

                        <Card className="p-16 text-center">
                            <div className="w-24 h-24 mx-auto rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-5xl text-slate-300 dark:text-slate-600 mb-5">
                                <Icon name="folder-open" />
                            </div>
<h3 className="text-xl font-bold text-slate-700 dark:text-slate-200 mb-2">Chưa có bài tập nào được giao. Hãy quay lại sau!</h3>
                            <p className="text-base text-slate-500 dark:text-slate-400 max-w-md mx-auto leading-relaxed">
                                Hãy chờ giảng viên phát đề! Khi có bài tập mới, nó sẽ xuất hiện tại đây.
                            </p>
                        </Card>
                    </div>
                );
            }

            const a = assignment ? assignment.assignment : null;
            const hole = a ? a.hole : null;
            const shaft = a ? a.shaft : null;

            return (
                <div className="space-y-8 animate-fadeInUp">
                    {/* Header */}
                    <div className="flex justify-between items-center no-print">
                        <div>
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center shadow-primary-glow">
                                    <Icon name="pen-to-square" />
                                </div>
                                <h2 className="text-2xl lg:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Bài Tập Của Tôi</h2>
                            </div>
                            <p className="text-sm text-slate-500 dark:text-slate-400 ml-14">Làm bài, nộp và hệ thống tự động chấm điểm theo chuẩn ISO 286.</p>
                        </div>
                        {a && (
                            <div className="text-right bg-white dark:bg-slate-800 px-4 py-2 rounded-xl border border-slate-100 dark:border-slate-800/60 shadow-soft">
                                <div className="text-xs text-slate-500 dark:text-slate-400">Mã đề</div>
                                <div className="font-mono font-bold text-sm text-slate-800 dark:text-white">{a.examCode || '—'}</div>
                            </div>
                        )}
                    </div>

                    {/* Thông tin sinh viên + đề bài */}
                    {assignment && !isSubmitted && (
                        <Card className="p-6 lg:p-8 no-print space-y-6">
                            <div className="flex flex-col md:flex-row md:items-center gap-4 bg-gradient-to-br from-emerald-50 to-teal-50 dark:from-emerald-950/30 dark:to-teal-950/15 border border-emerald-200 dark:border-emerald-800/50 rounded-2xl p-5">
                                <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center text-xl shrink-0">
                                    <Icon name="circle-user" />
                                </div>
                                <div className="flex-1">
                                    <div className="font-bold text-base text-slate-900 dark:text-white">{a.student.name}</div>
                                    <div className="text-sm font-mono text-slate-600 dark:text-slate-300">
                                        MSSV: <strong>{a.student.mssv}</strong> · Lớp: <strong>{a.student.className}</strong>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="text-xs text-slate-500 dark:text-slate-400">Đề bài</div>
                                    <div className="font-mono text-xl font-bold text-slate-900 dark:text-white">
                                        ϕ{a.D} {hole.sym}{hole.it}/{shaft.sym}{shaft.it}
                                    </div>
                                    <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{a.diffLabel} · {a.fit.type}</div>
                                </div>
                            </div>

                            <div>
                                <h3 className="font-bold text-lg tracking-tight text-slate-800 dark:text-white mb-3 flex items-center gap-2">
                                    <Icon name="list-check" className="text-emerald-500" /> Yêu cầu: Tra Sai lệch giới hạn của Lỗ & Trục
                                </h3>
                                <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-4">
                                    Cho mối ghép trụ tròn <strong className="font-mono">ϕ{a.D} {hole.sym}{hole.it}/{shaft.sym}{shaft.it}</strong>.
                                    Hãy tra bảng ISO 286 và điền đầy đủ 4 sai lệch giới hạn (đơn vị <strong>µm</strong>):
                                </p>

                                {/* Form nhập liệu đáp án */}
                                <form onSubmit={handleSubmit} className="grid grid-cols-2 lg:grid-cols-4 gap-4 no-print">
                                    {[
                                        { key: 'ES', label: 'ES (Lỗ)', sub: 'Sai lệch trên Lỗ', tone: 'hole', icon: 'arrow-up-from-bracket' },
                                        { key: 'EI', label: 'EI (Lỗ)', sub: 'Sai lệch dưới Lỗ', tone: 'hole', icon: 'arrow-down-to-bracket' },
                                        { key: 'es', label: 'es (Trục)', sub: 'Sai lệch trên Trục', tone: 'shaft', icon: 'arrow-up-from-bracket' },
                                        { key: 'ei', label: 'ei (Trục)', sub: 'Sai lệch dưới Trục', tone: 'shaft', icon: 'arrow-down-to-bracket' }
                                    ].map(field => {
                                        const isHole = field.tone === 'hole';
                                        return (
                                            <div key={field.key} className="bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 transition-all duration-300 hover:border-emerald-400 focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20">
                                                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1">
                                                    <Icon name={field.icon} className={`mr-1 ${isHole ? 'text-hole-text' : 'text-shaft-text'}`} />
                                                    {field.label}
                                                </label>
                                                <div className="text-[10px] text-slate-400 dark:text-slate-500 mb-2">{field.sub}</div>
                                                <input
                                                    type="number"
                                                    step="any"
                                                    value={formData[field.key]}
                                                    onChange={e => setFormData(prev => ({ ...prev, [field.key]: e.target.value }))}
                                                    placeholder="µm"
                                                    className={`w-full bg-white dark:bg-slate-800 border ${isHole ? 'border-hole-border/60 focus:ring-hole-border/40' : 'border-shaft-border/60 focus:ring-shaft-border/40'} rounded-xl p-3 text-slate-900 dark:text-white font-mono font-bold text-center outline-none focus:ring-2 transition-all duration-300 shadow-sm placeholder:text-slate-300 dark:placeholder:text-slate-600`}
                                                />
                                            </div>
                                        );
                                    })}

                                    {error && (
                                        <div className="col-span-2 lg:col-span-4 bg-rose-50 dark:bg-rose-950/40 border border-rose-300 dark:border-rose-800 border-l-4 border-l-rose-500 text-rose-700 dark:text-rose-300 px-4 py-3 rounded-xl text-sm flex items-start gap-2.5" role="alert">
                                            <Icon name="circle-exclamation" className="mt-0.5 shrink-0" />
                                            <span>{error}</span>
                                        </div>
                                    )}

                                    <div className="col-span-2 lg:col-span-4 flex flex-col sm:flex-row gap-3 pt-1">
                                        <button
                                            type="submit"
                                            disabled={submitting}
                                            className="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:opacity-70 disabled:cursor-not-allowed text-white font-bold rounded-xl p-4 transition-all duration-300 flex items-center justify-center gap-2 shadow-soft hover:shadow-primary-glow hover:scale-[1.01] active:scale-[0.99] tracking-wide"
                                        >
                                            {submitting ? <Icon name="spinner" className="fa-spin" /> : <Icon name="paper-plane" />}
                                            {submitting ? 'Đang chấm bài...' : 'NỘP BÀI'}
                                        </button>
                                        <button
                                            type="button"
                                            onClick={handleReset}
                                            disabled={submitting}
                                            className="sm:w-44 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-xl font-semibold transition-all duration-300 flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 hover:scale-[1.02] active:scale-95 text-sm disabled:opacity-60"
                                        >
                                            <Icon name="eraser" /> Nhập lại
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </Card>
                    )}

                    {/* ====== THẺ KẾT QUẢ (RESULT CARD) ====== */}
                    {isSubmitted && result && (
                        <Card className={`overflow-hidden border-0 ${result.score >= 8 ? 'border-t-4 border-t-emerald-500' : result.score >= 5 ? 'border-t-4 border-t-amber-500' : 'border-t-4 border-t-rose-500'}`}>
                            {/* Header điểm */}
                            <div className={`bg-gradient-to-br p-6 lg:p-8 relative overflow-hidden ${result.score >= 8 ? 'from-emerald-500 via-emerald-600 to-teal-700' : result.score >= 5 ? 'from-amber-500 via-amber-600 to-orange-700' : 'from-rose-500 via-rose-600 to-red-700'}`}>
                                {/* Decorative circles */}
                                <div className="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-white/10"></div>
                                <div className="absolute -bottom-16 -left-10 w-52 h-52 rounded-full bg-black/10"></div>
                                
                                <div className="relative flex flex-col lg:flex-row lg:items-center gap-6">
                                    <div className="flex-1 text-white">
                                        <div className="flex items-center gap-2 mb-1.5">
                                            <span className="bg-white/20 backdrop-blur px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                                                <Icon name={result.already_submitted ? 'circle-check' : 'trophy'} className="mr-1" />
                                                Bạn đã hoàn thành bài tập
                                            </span>
                                        </div>
                                        <h3 className="text-2xl lg:text-3xl font-bold tracking-tight drop-shadow-md">
                                            KẾT QUẢ CHẤM ĐIỂM TỰ ĐỘNG
                                        </h3>
                                        <p className="text-white/80 text-sm mt-2 flex items-center gap-2">
                                            <Icon name="file-lines" /> Mã đề: <span className="font-mono font-bold">{a ? a.examCode : '—'}</span>
                                            {a && <span className="ml-2 font-mono">ϕ{a.D} {hole.sym}{hole.it}/{shaft.sym}{shaft.it}</span>}
                                        </p>
                                    </div>

                                    {/* Điểm số lớn */}
                                    <div className="flex items-center gap-5">
                                        <div className="bg-white/20 backdrop-blur-md rounded-2xl px-8 py-5 text-center shadow-xl border border-white/20">
                                            <div className="text-5xl lg:text-6xl font-bold text-white drop-shadow-md font-mono">{result.score}</div>
                                            <div className="text-white/90 text-sm font-semibold tracking-wider mt-1">/ 10.0 ĐIỂM</div>
                                        </div>
                                        <div className="text-center text-white">
                                            <div className="w-16 h-16 mx-auto rounded-full bg-white/20 border-2 border-white/40 flex items-center justify-center text-3xl mb-1">
                                                <Icon name={result.score >= 8 ? 'face-smile' : result.score >= 5 ? 'face-meh' : 'face-frown'} />
                                            </div>
                                            <div className="text-xs font-semibold uppercase tracking-wider text-white/85">
                                                {result.score >= 8 ? 'Xuất sắc!' : result.score >= 5 ? 'Đạt yêu cầu' : 'Cần cố gắng'}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Bảng đối chiếu Đáp án của bạn | Đáp án đúng | Kết quả */}
                            <div className="p-6 lg:p-8 bg-white dark:bg-slate-800/80">
                                <h4 className="font-bold text-lg text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                                    <Icon name="table-list" className="text-primary-500" /> Đối Chiếu Chi Tiết Từng Thông Số
                                </h4>

                                <div className="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
                                    <table className="w-full text-sm">
                                        <thead>
                                            <tr className="bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200 text-left">
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold">Thông số</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold text-center">Đáp án của bạn</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold text-center">Đáp án đúng</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold text-center">Kết quả</th>
                                                <th className="border-b border-slate-200 dark:border-slate-700 p-3.5 font-bold text-center">Điểm</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {(result.details || []).map((item, idx) => (
                                                <tr key={item.key} className={`border-b border-slate-100 dark:border-slate-800 ${item.is_correct ? 'bg-emerald-50/50 dark:bg-emerald-950/20' : 'bg-rose-50/50 dark:bg-rose-950/20'}`}>
                                                    <td className="p-3.5 font-medium text-slate-800 dark:text-slate-200">
                                                        <span className="font-mono font-bold">{item.key}</span>
                                                        <span className="text-xs text-slate-500 dark:text-slate-400 ml-2 hidden md:inline">{item.label}</span>
                                                    </td>
                                                    <td className="p-3.5 text-center font-mono font-bold text-slate-800 dark:text-white">
                                                        {Number(item.student) > 0 ? `+${item.student}` : item.student} µm
                                                    </td>
                                                    <td className="p-3.5 text-center font-mono font-bold text-slate-800 dark:text-white">
                                                        {Number(item.correct) > 0 ? `+${item.correct}` : item.correct} µm
                                                    </td>
                                                    <td className="p-3.5 text-center">
                                                        {item.is_correct ? (
                                                            <span className="inline-flex items-center gap-1.5 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 px-3 py-1 rounded-full font-bold text-xs border border-emerald-300 dark:border-emerald-800">
                                                                <Icon name="check" /> Đúng
                                                            </span>
                                                        ) : (
                                                            <span className="inline-flex items-center gap-1.5 bg-rose-100 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 px-3 py-1 rounded-full font-bold text-xs border border-rose-300 dark:border-rose-800">
                                                                <Icon name="xmark" /> Sai
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="p-3.5 text-center font-mono font-bold text-slate-700 dark:text-slate-300">
                                                        {item.is_correct ? '2.5' : '0.0'}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                        <tfoot>
                                            <tr className="bg-slate-100 dark:bg-slate-900 font-bold text-slate-900 dark:text-white">
                                                <td colSpan="4" className="p-4 text-right uppercase tracking-wider text-sm">Tổng điểm:</td>
                                                <td className="p-4 text-center font-mono text-lg text-emerald-600 dark:text-emerald-400">{result.score} / 10.0</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>

                                {/* Đề bài + Đáp án đúng tham khảo */}
                                {hole && shaft && (
                                    <div className="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-gradient-to-br from-sky-50 to-blue-50 dark:from-sky-950/30 dark:to-blue-950/15 border border-sky-200 dark:border-sky-800/50 rounded-xl p-4">
                                            <div className="font-bold text-sm text-hole-text mb-2"><Icon name="circle-dot" className="mr-1" /> Lỗ ϕ{a.D} {hole.sym}{hole.it}</div>
                                            <div className="font-mono text-xs text-slate-600 dark:text-slate-300 space-y-1">
                                                <div>ES = {hole.ES > 0 ? `+${hole.ES}` : hole.ES} µm · EI = {hole.EI} µm</div>
                                                <div>Dmax = {hole.Dmax.toFixed(3)} mm · Dmin = {hole.Dmin.toFixed(3)} mm</div>
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-orange-50 to-amber-50 dark:from-orange-950/30 dark:to-amber-950/15 border border-orange-200 dark:border-orange-800/50 rounded-xl p-4">

                                            <div className="font-mono text-xs text-slate-600 dark:text-slate-300 space-y-1">
                                                <div>es = {shaft.es > 0 ? `+${shaft.es}` : shaft.es} µm · ei = {shaft.ei > 0 ? `+${shaft.ei}` : shaft.ei} µm</div>
                                                <div>dmax = {shaft.dmax.toFixed(3)} mm · dmin = {shaft.dmin.toFixed(3)} mm</div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4">
                                    <p className="text-sm text-slate-600 dark:text-slate-300 flex items-center gap-2">
                                        <Icon name="circle-info" className="text-primary-500" />
                                        Bài tập đã hoàn thành. Bạn không thể nộp lại lần hai.
                                    </p>
                                    <button
                                        onClick={() => window.print()}
                                        className="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 px-4 py-2.5 rounded-xl font-semibold transition-all duration-300 flex items-center gap-2 border border-slate-200 dark:border-slate-700 hover:scale-[1.03] active:scale-95 text-sm shrink-0"
                                    >
                                        <Icon name="print" /> In kết quả
                                    </button>
                                </div>
                            </div>
                        </Card>
